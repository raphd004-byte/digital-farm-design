<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Farm Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green: #3f6b46; --green-dark: #2d4f32; --green-light: #eaf1e9;
    --amber: #b9701f; --ink: #1f3a52; --ink-soft: #5c7285;
    --paper: #faf8f2; --paper-line: rgba(31,58,82,0.09);
    --rule: rgba(31,58,82,0.2); --white: #ffffff;
    --font-sans: 'Inter', system-ui, sans-serif;
    --font-serif: 'DM Serif Display', Georgia, serif;
  }
  body {
    font-family: var(--font-sans); color: var(--ink);
    background: linear-gradient(135deg, var(--green-dark) 0%, var(--green) 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .login-card {
    background: var(--white); border-radius: 12px;
    padding: 40px 36px; width: 100%; max-width: 400px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }
  .login-header { text-align: center; margin-bottom: 32px; }
  .login-header .logo {
    width: 56px; height: 56px; margin: 0 auto 16px;
    background: var(--green-light); border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .login-header .logo svg { width: 32px; height: 32px; }
  .login-header h1 {
    font-family: var(--font-serif); font-size: 24px; font-weight: 400;
    color: var(--ink); margin-bottom: 4px;
  }
  .login-header p { font-size: 13px; color: var(--ink-soft); }
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--ink); margin-bottom: 4px;
  }
  .form-group input {
    width: 100%; padding: 10px 12px;
    border: 1px solid var(--rule); border-radius: 8px;
    font-size: 14px; background: var(--paper);
    color: var(--ink); transition: border-color 0.15s;
  }
  .form-group input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(63,107,70,0.1); }
  .login-btn {
    width: 100%; padding: 11px; background: var(--green); color: white;
    border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: background 0.15s; margin-top: 8px;
  }
  .login-btn:hover { background: var(--green-dark); }
  .login-error {
    background: #fef2f2; border: 1px solid #fecaca; color: #dc2626;
    padding: 10px 12px; border-radius: 8px; font-size: 13px;
    margin-bottom: 16px; display: none;
  }
  .login-footer { text-align: center; margin-top: 24px; font-size: 12px; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-header">
    <div class="logo">
      <svg viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="14" stroke="#3f6b46" stroke-width="2"/>
        <path d="M16 8c-2 0-4 1.5-4 4 0 1.5.5 3 2 4l-2 4h6l-2-4c1.5-1 2-2.5 2-4 0-2.5-2-4-4-4z" fill="#3f6b46"/>
        <path d="M12 20c0 2 1 4 4 4s4-2 4-4" stroke="#3f6b46" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>Farm Admin</h1>
    <p>Sign in to manage your farm</p>
  </div>

  <div class="login-error" id="loginError"></div>

  <form id="loginForm">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="admin" autocomplete="username">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
    </div>
    <button type="submit" class="login-btn">Sign In</button>
  </form>

  <div class="login-footer">
    Digital Farm System
  </div>
</div>

<script>
const API = '';
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('loginError');
  errorEl.style.display = 'none';
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  try {
    const res = await fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.error || 'Login failed';
      errorEl.style.display = 'block';
      return;
    }
    window.location.href = '/admin';
  } catch (err) {
    errorEl.textContent = 'Network error. Please try again.';
    errorEl.style.display = 'block';
  }
});
</script>
</body>
</html>
